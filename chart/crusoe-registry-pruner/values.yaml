config:
  ageFrom: ""
  deleteImages: false
  dryRun: false
  keepTagPrefixes: []
  maxAge: ""
  tagState: ""
  timeout: ""
  pruneNeverPulled: false

concurrencyPolicy: "Forbid"
extraEnv: []

historyLimits:
  failed: 3
  successful: 3

imagePullSecrets: []

image:
  pullPolicy: "IfNotPresent"
  repository: "ghcr.io/jetbrains-research/crusoe-registry-pruner"
  tag: ""

log:
  format: "json"
  level: "info"
  source: false

priorityClassName: ""

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    memory: "64Mi"

restartPolicy: "Never"
schedule: "0 0 * * *"
secretName: "crusoe-secrets"
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
